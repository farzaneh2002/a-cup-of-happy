<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Yanone+Kaffeesatz:wght@500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        pacifico: ['Pacifico', 'cursive'],
                        yanone: ['"Yanone Kaffeesatz"', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: '#dca554',
                        darkbg: '#14100d',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100">

    <footer class="bg-darkbg h-[259px] font-inter w-full">
        <div class="max-w-[1200px] mx-auto px-5 h-full pt-[45px] pb-[40px] flex flex-col lg:flex-row justify-between items-start gap-10 lg:gap-0">
            
            <!-- Column 1: Brand & Bio -->
            <div class="w-full lg:w-[25%]">
                <a href="/" class="font-pacifico text-[34px] text-white block mb-3 leading-none">
                    A Cup of Happy
                </a>
                <p class="text-[#d4d4d4] text-[15px] leading-[1.4] mb-5">
                    Lorem ipsum dolor sit amet,<br>
                    consectetur adipiscing elit.<br>
                    Sed do eiusmod tempor incididun
                </p>
                <!-- Social Icons -->
                <div class="flex items-center gap-4">
                    <a href="#" aria-label="YouTube" class="text-brand hover:text-white transition-colors">
                        <svg class="w-[18px] h-[18px] stroke-current stroke-2 fill-none" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                            <path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"></path>
                            <polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon>
                        </svg>
                    </a>
                    <a href="#" aria-label="Twitter" class="text-brand hover:text-white transition-colors">
                        <svg class="w-[18px] h-[18px] stroke-current stroke-2 fill-none" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                            <path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"></path>
                        </svg>
                    </a>
                    <a href="#" aria-label="Instagram" class="text-brand hover:text-white transition-colors">
                        <svg class="w-[18px] h-[18px] stroke-current stroke-2 fill-none" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                        </svg>
                    </a>
                </div>
            </div>

            <!-- Column 2: Shop Links -->
            <div class="w-full lg:w-[13%]">
                <h4 class="text-white font-yanone font-bold text-[20px] uppercase mb-1 tracking-wide">SHOP</h4>
                <div class="w-[90%] h-[1px] bg-[#4a4036] mb-3"></div>
                <ul class="flex flex-col gap-1.5">
                    <li><a href="/coffee-beans" class="text-[#d4d4d4] text-[15px] hover:text-brand transition-colors">Coffee Beans</a></li>
                    <li><a href="/ground-coffee" class="text-[#d4d4d4] text-[15px] hover:text-brand transition-colors">Ground Coffee</a></li>
                    <li><a href="/brewing-gear" class="text-[#d4d4d4] text-[15px] hover:text-brand transition-colors">Brewing Gear</a></li>
                    <li><a href="/subscriptions" class="text-[#d4d4d4] text-[15px] hover:text-brand transition-colors">Subscriptions</a></li>
                    <li><a href="/gift-cards" class="text-[#d4d4d4] text-[15px] hover:text-brand transition-colors">Gift Cards</a></li>
                </ul>
            </div>

            <!-- Column 3: Company Links -->
            <div class="w-full lg:w-[13%]">
                <h4 class="text-white font-yanone font-bold text-[20px] uppercase mb-1 tracking-wide">COMPANY</h4>
                <div class="w-[90%] h-[1px] bg-[#4a4036] mb-3"></div>
                <ul class="flex flex-col gap-1.5">
                    <li><a href="/about" class="text-[#d4d4d4] text-[15px] hover:text-brand transition-colors">Our Story</a></li>
                    <li><a href="/sourcing" class="text-[#d4d4d4] text-[15px] hover:text-brand transition-colors">Sourcing</a></li>
                    <li><a href="/contact" class="text-[#d4d4d4] text-[15px] hover:text-brand transition-colors">Contact Us</a></li>
                    <li><a href="/blog" class="text-[#d4d4d4] text-[15px] hover:text-brand transition-colors">Blog</a></li>
                    <li><a href="/faq" class="text-[#d4d4d4] text-[15px] hover:text-brand transition-colors">FAQs</a></li>
                </ul>
            </div>

            <!-- Column 4: Newsletter Form -->
            <div class="w-full lg:w-[34%] flex flex-col items-start pt-1 lg:pt-0">
                <h4 class="text-white font-inter font-normal text-[15px] uppercase mb-4 tracking-wide">
                    DIRECT MESSAGES TO US
                </h4>
                
                <form action="#" class="flex flex-row w-full h-[40px] gap-1.5">
                    <input 
                        type="email" 
                        placeholder="Value" 
                        required
                        class="flex-grow bg-white text-[#111] placeholder-[#b0b0b0] px-4 outline-none rounded-[4px] text-[15px] font-inter font-normal"
                    >
                    <button 
                        type="submit" 
                        class="bg-brand text-[#111] font-inter font-medium uppercase text-[14px] px-6 rounded-[4px] hover:bg-[#c48b3d] transition-colors"
                    >
                        SEND
                    </button>
                </form>
            </div>

        </div>
    </footer>

</body>
</html>
