<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Cup of Happy</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Playfair+Display+SC:wght@400;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        pacifico: ['Pacifico', 'cursive'],
                        playfair: ['"Playfair Display SC"', 'serif'],
                    },
                    colors: {
                        brand: '#dca554',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer components {
            .nav-link {
                @apply text-[#111] text-[15px] tracking-[1.5px] uppercase transition-colors duration-300 hover:text-brand;
            }
            .icon-btn {
                @apply text-[#111] transition-colors duration-300 hover:text-brand flex items-center justify-center;
            }
            .icon-svg {
                @apply stroke-current stroke-2 fill-none w-[22px] h-[22px];
            }
        }
    </style>
</head>
<body class="bg-[#f4f4f4] font-playfair">

    <header class="w-full h-[70px] bg-white shadow-sm">
        <div class="max-w-[1200px] mx-auto px-5 h-full flex items-center justify-between">
            
            <a href="/" class="font-pacifico text-[32px] text-[#111] leading-none">
                A Cup of Happy
            </a>

            <nav class="h-full">
                <ul class="flex gap-[35px] h-full items-center">
                    <li class="h-full flex items-center">
                        <a href="/" class="nav-link relative flex items-center h-full">
                            Home
                            <span class="absolute left-0 bottom-[20px] w-full h-[2px] bg-brand"></span>
                        </a>
                    </li>
                    <li><a href="/store" class="nav-link">Store</a></li>
                    <li><a href="/about" class="nav-link">About Us</a></li>
                    <li><a href="/contact" class="nav-link">Contact</a></li>
                    <li><a href="/blog" class="nav-link">Blog</a></li>
                </ul>
            </nav>

            <div class="flex items-center gap-6">
                <a href="/search" class="icon-btn" aria-label="Search">
                    <svg class="icon-svg" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <circle cx="10" cy="10" r="7"></circle>
                        <line x1="15" y1="15" x2="21" y2="21"></line>
                    </svg>
                </a>
                
                <a href="/profile" class="icon-btn" aria-label="Profile">
                    <svg class="icon-svg" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <circle cx="12" cy="8" r="3.5"></circle>
                        <path d="M5 21v-1c0-3.5 3-6 7-6s7 2.5 7 6v1"></path>
                    </svg>
                </a>
                
                <a href="/cart" class="icon-btn" aria-label="Cart">
                    <svg class="icon-svg w-6 h-6" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <path d="M3 4h2l2.4 12.2a2 2 0 0 0 2 1.8h7.2a2 2 0 0 0 2-1.7L21 8H6"></path>
                        <circle cx="9" cy="21" r="1.5" class="fill-current stroke-none"></circle>
                        <circle cx="18" cy="21" r="1.5" class="fill-current stroke-none"></circle>
                    </svg>
                </a>
            </div>

        </div>
    </header>

</body>
</html>
